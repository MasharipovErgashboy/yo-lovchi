<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#F0F4F8" />
    <title>Haydovchilar - Yo'lovchi</title>
    <link rel="preconnect" href="https://telegram.org" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        try {
          if (window.Telegram && window.Telegram.WebApp) {
            var tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            if (typeof tg.requestFullscreen === 'function') {
              tg.requestFullscreen();
            }
            if (typeof tg.disableVerticalSwipes === 'function') {
              tg.disableVerticalSwipes();
            }
            if (typeof tg.setHeaderColor === 'function') {
              tg.setHeaderColor('#F0F4F8');
            }
            if (typeof tg.setBackgroundColor === 'function') {
              tg.setBackgroundColor('#F0F4F8');
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        background-color: #F0F4F8;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .instant-shell {
        display: flex;
        flex-direction: column;
        padding: 24px 20px;
        gap: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .instant-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .instant-card {
        background: #FFFFFF;
        border-radius: 20px;
        padding: 40px 20px;
        min-height: 280px;
        border: 1px solid #E5E7EB;
        box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="instant-shell">
        <div class="instant-header">
          <div>
            <div style="font-size: 28px; font-weight: 700; color: #111827; margin-bottom: 4px;">Joylashuv</div>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #10B981; font-weight: 500;">
              <span style="width: 8px; height: 8px; background: #10B981; border-radius: 50%;"></span> Haydovchi rejimi
            </div>
          </div>
        </div>
        <div class="instant-card">
          <div style="width: 70px; height: 70px; border-radius: 50%; background: #E6F0FF; margin-bottom: 16px;"></div>
          <div style="font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 6px;">Joylashuv yuklanmoqda...</div>
          <div style="font-size: 14px; color: #6B7280;">Tizim faollashtirilmoqda</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
