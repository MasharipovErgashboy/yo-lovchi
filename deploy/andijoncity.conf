# 4. Admin Panel (andijoncity.uz va admin.andijoncity.uz)
server {
    listen 80;
    server_name andijoncity.uz admin.andijoncity.uz;
    root /root/yo-lovchi/admin/dist;
    index index.html;

    location / {
