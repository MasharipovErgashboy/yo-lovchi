# 1. API Backend (api.andijoncity.uz)
server {
    listen 80;
    server_name api.andijoncity.uz;

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Haydovchi Mini App (driver.andijoncity.uz)
server {
    listen 80;
    server_name driver.andijoncity.uz;
    root /root/yo-lovchi/haydovchilar/app/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8008/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Yo'lovchi Mini App (app.andijoncity.uz)
server {
    listen 80;
