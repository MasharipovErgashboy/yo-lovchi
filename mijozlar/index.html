<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Yo'lovchi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        var hash = window.location.hash || '';
        var search = window.location.search || '';
        var isTgParam = hash.indexOf('tgWebAppData') !== -1 || 
                        search.indexOf('tgWebAppData') !== -1 ||
                        hash.indexOf('tgWebAppVersion') !== -1 ||
                        search.indexOf('tgWebAppVersion') !== -1 ||
                        hash.indexOf('tgWebAppPlatform') !== -1 ||
                        search.indexOf('tgWebAppPlatform') !== -1;
        var hasProxy = typeof window.TelegramWebviewProxy !== 'undefined';
        var tg = window.Telegram && window.Telegram.WebApp;
        var hasInitData = Boolean(tg && tg.initData && tg.initData.length > 0);
        var isKnownPlatform = Boolean(tg && tg.platform && tg.platform !== 'unknown');

        var isInsideTelegram = isTgParam || hasProxy || hasInitData || isKnownPlatform;

        if (!isInsideTelegram) {
          // If opened in a regular browser outside Telegram, redirect to Passenger Telegram Bot
          window.location.replace("https://t.me/Uz404bot");
          return;
        }

        try {
          if (tg) {
            tg.ready();
            tg.expand();
          }
        } catch (e) {}
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0;url=https://t.me/Uz404bot" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
