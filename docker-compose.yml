services:
  postgres:
    image: postgres:16-alpine
    container_name: yolovchi-postgres
    restart: always
    environment:
      POSTGRES_DB: yo_lovchi
      POSTGRES_USER: yolovchi
      POSTGRES_PASSWORD: yolovchi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
